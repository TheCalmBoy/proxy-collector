name: Freshness Watchdog

on:
  schedule:
    # 10-minute heartbeat. This tick costs ~1 minute of runner time (two
    # curl fetches + one python call) and is free on a public repo. Both
    # decision thresholds (30 / 10 min) exceed one 10-min cadence, so a
    # healthy chain never dispatches a duplicate; a missed slot is caught on
    # the next tick.
    #
    # This workflow exists because GitHub's free-tier schedule: crons on the
    # two heavy workflows are best-effort and get delayed or skipped under
    # load. A skipped update freezes the pool; the stale-pool guard then
    # freezes the health index; the worker's join drops configs and the
    # served subscription shrinks for hours (the 2026-10-01 incident: 5
    # skipped hourly runs, health join collapsed 93 -> 71).
    #
    # The watchdog cannot stop the scheduler from skipping ticks. It gives
    # the pipeline a second, independent trigger path: if the heavy cron
    # misses a tick, the next watchdog tick detects the freeze and dispatches
    # the heavy workflow itself. Worst case the pipeline degrades from
    # "every 30 min" to "every ~40 min", instead of freezing.
    - cron: "*/10 * * * *"
  # External heartbeat path (0xRadikal pattern): a Cloudflare Worker cron POSTs
  # to /dispatches every 5 minutes. This is the trigger that cannot be skipped
  # by GitHub's best-effort scheduler -- the 2026-10-01 freeze happened because
  # the ONLY waking paths (schedule: on update, schedule: here) both lived on
  # the same flaky scheduler. repository_dispatch wakes this job on any
  # external beat; the freshness gate below still no-ops when the pool is
  # fresh, so the extra trigger costs nothing.
  repository_dispatch:
    types: [heartbeat]
  workflow_dispatch: {}

permissions:
  contents: read
  # repository_dispatch is the non-cron trigger path (the 0xRadikal pattern):
  # it wakes the heavy workflows without relying on their own schedule.
  actions: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      # gh needs a token inside Actions for both `gh run list` (--check-active)
      # and `gh workflow run` (the dispatches). The default GITHUB_TOKEN has
      # the actions:write permission this job declares.
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Download the two published documents
        shell: bash
        run: |
          set -euo pipefail
          # Both are best-effort: a 404/missing document means "not published
          # yet / skipped", which is exactly what the decision handles - a
          # missing pool doc leads to "update", a missing health doc to "probe".
          curl --silent --location \
            "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/gh-pages/enriched-configs.json?ts=$(date +%s)" \
            -o watch-pool.json || true
          curl --silent --location \
            "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/gh-pages/egress-health.json?ts=$(date +%s)" \
            -o watch-health.json || true

      - name: Decide
        id: decide
        shell: bash
        # Freshness thresholds (two independent checks, 10-min cadence):
        #   pool stale     > 30 min -> the chain missed a slot; re-collect
        #                               now (which re-chains its own probe).
        #   health stale   > 10 min -> the current pool has not been measured;
        #                               dispatch the probe on its own.
        # When both are stale, update wins (its chained probe covers it; the
        # probe check re-fires next tick if the chain dispatch dies). The
        # --check-active guard skips a dispatch while a heavy run is
        # queued/running or finished within the last 30 min.
        run: |
          set -euo pipefail
          # --check-active: if a dispatched update/probe is already queued or
          # running (or one finished within the last 20 min), don't dispatch a
          # second one - the recent tick already fired the recovery.
          out=$(python tools/freshness_watch.py --pool watch-pool.json --health watch-health.json --check-active)
          echo "decision=$(echo "$out" | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          echo "reason=$(echo "$out" | cut -d' ' -f2-)" >> "$GITHUB_OUTPUT"
          echo "$out"

      - name: Dispatch update.yml
        if: steps.decide.outputs.decision == 'update'
        shell: bash
        run: |
          gh workflow run update.yml --ref main --field verify_limit=0
          echo "update.yml dispatched: ${{ steps.decide.outputs.reason }}"

      - name: Dispatch probe-egress.yml
        if: steps.decide.outputs.decision == 'probe'
        shell: bash
        run: |
          gh workflow run probe-egress.yml --ref main
          echo "probe-egress.yml dispatched: ${{ steps.decide.outputs.reason }}"
