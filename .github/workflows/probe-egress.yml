name: Probe proxy egress IPs

on:
  schedule:
    # Hourly at :37, deliberately 30 min AFTER update.yml's :07 run.
    #
    # This workflow has no input and no shared state with update.yml. It fetches
    # the pool from gh-pages:
    #
    #     gh-pages/enriched-configs.json
    #
    # which only the update.yml run produces. So the ordering IS the whole
    # contract, and a cron cannot express it: the :37 probe is guaranteed to
    # start after the :07 update's earliest start, and the update takes 10-23
    # min, so the pool on gh-pages is already this hour's by the time it lands.
    #
    # Before (2026-09-29) this was "5,35" against update.yml's "7,37". Both ran
    # twice an hour and the probe fired 2 min BEFORE each update, so it always
    # measured the PREVIOUS hour's pool -- and at :35 it raced the :37 publish,
    # which is a truncated-raw-file read. Their concurrency groups are separate
    # (proxy-egress-probe vs proxy-database-update), so nothing serialized them.
    #
    # If you change this cron, also change update.yml's. The invariant is:
    # update fires first, 30 min of gap, and the gap exceeds a full update run.
    - cron: "37 * * * *"
  workflow_dispatch:
    inputs:
      probe_concurrency:
        description: "Concurrent speed tests through sing-box. Each one is a 5 MB download, so this is real runner bandwidth, not just sockets."
        required: false
        default: "50"

permissions:
  contents: write

concurrency:
  group: proxy-egress-probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      PROBE_BATCH_SIZE: "all"
      # 750 concurrent 5 MB downloads through one sing-box process saturated
      # the runner: 99/174 died with curl exit 35 (TLS handshake failure) and
      # 50 with exit 97 (proxy handshake rejected), which is local resource
      # exhaustion masquerading as dead proxies. Phase 1 uses 750 sockets for
      # cheap one-byte CONNECTs; phase 2 moves real payload, so it gets 50.
      PROBE_CONCURRENCY: ${{ inputs.probe_concurrency || '50' }}
      RETEST_DELAY_SECONDS: "300"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install sing-box
        shell: bash
        run: |
          set -euo pipefail
          version="1.14.0"
          archive="sing-box-${version}-linux-amd64.tar.gz"
          curl --fail --location --silent --show-error --retry 3 \
            "https://github.com/SagerNet/sing-box/releases/download/v${version}/${archive}" \
            -o "/tmp/${archive}"
          echo "2375de6999f4f56ab46b4fc5ddf26a6aba1d3e61a0f4e7ddec2f4690457d5f63  /tmp/${archive}" | sha256sum --check --status
          tar -xzf "/tmp/${archive}" -C /tmp
          sudo install -m 0755 "/tmp/sing-box-${version}-linux-amd64/sing-box" /usr/local/bin/sing-box
          sing-box version

      - name: Fetch verified configs from Phase 1
        # probe_egress.py reads verify-output/enriched-configs.json, but that
        # file is a build artifact of the update.yml runner and is never
        # committed. This workflow is a separate job with a fresh checkout, so
        # the file has to be fetched. The only published copy lives on gh-pages,
        # which update.yml writes at the end of every successful run.
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p verify-output
          curl --fail --location --silent --show-error --retry 3 --retry-delay 10 \
            "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/gh-pages/enriched-configs.json?ts=$(date +%s)" \
            -o verify-output/enriched-configs.json
          test -s verify-output/enriched-configs.json
          python - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path("verify-output/enriched-configs.json").read_text())
          print(f"Fetched {len(data.get('configs', []))} verified configs from Phase 1")
          PY

      - name: Reject a stale pool
        # The :37 cron assumes the :07 update already republished. Crons are
        # best-effort on both sides, so a skipped or failed update used to look
        # exactly like a healthy run: the probe fetched yesterday's
        # enriched-configs.json, measured it, and published an egress-health.json
        # with a fresh generated_at -- a health report describing a pool that no
        # longer exists.
        #
        # Fail loudly instead. The window is 2h because the normal gap is 30 min
        # and a full update run is 10-23 min; 2h only trips when two consecutive
        # hourly updates are missing, which is never healthy.
        shell: bash
        env:
          MAX_POOL_AGE_MINUTES: "120"
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, sys
          from datetime import datetime, timezone
          from pathlib import Path

          path = Path("verify-output/enriched-configs.json")
          generated_at = json.loads(path.read_text())["generated_at"]
          produced = datetime.fromisoformat(generated_at)
          if produced.tzinfo is None:
              produced = produced.replace(tzinfo=timezone.utc)
          age_min = (datetime.now(timezone.utc) - produced).total_seconds() / 60
          limit = float(os.environ["MAX_POOL_AGE_MINUTES"])
          print(f"pool generated_at={generated_at} age={age_min:.1f} min (limit {limit:.0f})")
          if age_min > limit:
              sys.exit(
                  f"REFUSING TO PROBE: enriched-configs.json is {age_min:.1f} min old.\n"
                  f"The :07 update.yml run did not publish. Probing a stale pool would "
                  f"publish an egress-health.json describing configs that are already gone."
              )
          PY

      - name: Run initial and delayed egress checks
        shell: bash
        env:
          WORKER_URL: https://proxy-egress-ip-check.keqa94tfn-cgr8m3z.workers.dev
          WORKER_TOKEN: ${{ secrets.IP_CHECK_WORKER_TOKEN }}
        run: |
          # This step opens one socket per concurrent config, and the default
          # soft limit is ~1024. update.yml raises it; this workflow never did,
          # so under concurrency it hits EMFILE and the failures look like
          # broken proxies.
          ulimit -n 65535 || echo "warning: could not raise fd limit"
          ulimit -n
          python tools/probe_egress.py

      - name: Upload sing-box log
        # Always uploaded and not if-guarded. When sing-box dies mid-run every
        # probe fails with curl exit 7 and the log is the only thing that says
        # why; the report artifact is skipped precisely when the run fails.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: proxy-egress-sing-box-${{ github.run_id }}
          path: /tmp/probe-egress-sing-box.log
          retention-days: 14
          if-no-files-found: warn

      - name: Upload egress report
        if: always() && hashFiles('probe-output/report.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: proxy-egress-report-${{ github.run_id }}
          path: probe-output/report.json
          retention-days: 14

      - name: Publish latest egress health index
        if: success() && hashFiles('probe-output/egress-health.json') != ''
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const content = Buffer.from(fs.readFileSync('probe-output/egress-health.json')).toString('base64');
            const { owner, repo } = context.repo;
            for (let attempt = 0; attempt < 4; attempt++) {
              let sha;
              try {
                const existing = await github.rest.repos.getContent({ owner, repo, path: 'egress-health.json', ref: 'gh-pages' });
                sha = existing.data.sha;
              } catch (error) {
                if (error.status !== 404) throw error;
              }
              try {
                await github.rest.repos.createOrUpdateFileContents({
                  owner, repo, path: 'egress-health.json', branch: 'gh-pages', sha,
                  message: 'auto: publish proxy egress health', content,
                });
                break;
              } catch (error) {
                if (error.status !== 409 || attempt === 3) throw error;
              }
            }
