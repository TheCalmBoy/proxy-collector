# Why this exists
#
# update.yml installs dependencies and runs the collector, but no workflow in
# this repo invoked `unittest` or `pytest`. 132 tests existed and none of them
# were a gate. That is how two silent regressions shipped to a live
# subscription: the Worker looked up its health index by an id that the
# published feed never used, so every score was -1 and the "Best" group
# rendered empty -- HTTP 200 the entire time, nothing to alert on.
#
# This job is deliberately separate from update.yml's build job. It does not
# install sing-box, does not touch the network, and does not publish anything:
# it must stay fast enough to run on every push. If a test here needs the
# network or a sing-box binary, it belongs in update.yml, not here.
name: Test

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      # requirements.txt pins geoip2 and PySocks. Without geoip2, importing
      # main.py raises ModuleNotFoundError and every test that touches the
      # module -- not just the GeoIP ones -- fails to load, so the install is
      # not optional here.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run test suite
        run: python -m unittest discover -s tests -v

      # The Worker has its own suite (node:test) and nothing ran it, so a broken
      # profile could reach a live subscription with every gate green: mihomo
      # refuses the ENTIRE profile when one proxy names a type it does not have
      # ("unsupport proxy type: socks"), and one SOCKS5 exit node was enough to
      # make every client fail to load the subscription. Network-free: every
      # fetch in these tests is stubbed, so it belongs here rather than in
      # update.yml.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run Worker test suite
        run: node --test workers/proxy-chain-subscription/test/*.test.mjs workers/proxy-pipeline-heartbeat/test/*.test.mjs

      # Exercise the production subscription renderer with Mihomo itself.
      # This catches profile-level incompatibilities that string assertions
      # cannot detect (one unsupported node can invalidate the entire feed).
      - name: Install Mihomo
        shell: bash
        run: |
          set -euo pipefail
          release=$(curl -fsSL https://api.github.com/repos/MetaCubeX/mihomo/releases/latest)
          asset=$(python3 -c 'import json,sys; d=json.loads(sys.argv[1]); a=next((a for a in d["assets"] if "mihomo-linux-amd64-v" in a["name"] and a["name"].endswith(".gz")), {}); print(a.get("browser_download_url", "")); print(a.get("digest", ""))' "$release")
          url=$(printf '%s\n' "$asset" | sed -n '1p')
          digest=$(printf '%s\n' "$asset" | sed -n '2p')
          test -n "$url" || { echo "No linux-amd64 Mihomo release asset found"; exit 1; }
          curl --fail --location --silent --show-error --retry 3 "$url" -o /tmp/mihomo.gz
          if [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "${digest#sha256:}  /tmp/mihomo.gz" | sha256sum --check
          else
            echo "GitHub release did not provide an asset digest; checksum verification unavailable"
          fi
          gzip -dc /tmp/mihomo.gz > /tmp/mihomo
          sudo install -m 0755 /tmp/mihomo /usr/local/bin/mihomo
          mihomo -v

      - name: Validate rendered subscription with Mihomo
        run: |
          node workers/proxy-chain-subscription/scripts/render-mihomo-smoke.mjs > /tmp/proxy-collector-mihomo.yaml
          mihomo -t -f /tmp/proxy-collector-mihomo.yaml -d /tmp

      # The consistency checker exits non-zero only past --max-mismatch, so at
      # the default 10% budget this passes on live data (measured 6.2%). Raise
      # it deliberately once the upstream geolocation paths agree, not before.
      - name: Check published country tags against measured egress
        if: always()
        continue-on-error: true
        run: |
          if [ -f gh-pages/all.txt ] && [ -f gh-pages/egress-health.json ]; then
            python3 tools/country_consistency.py \
              --feed gh-pages/all.txt \
              --health gh-pages/egress-health.json
          else
            echo "published feed not present in a fresh checkout; skipping"
          fi
