name: Update Proxy Database

on:
  schedule:
    - cron: "0,30 * * * *"
  workflow_dispatch:
    inputs:
      verify_limit:
        description: "Maximum configs to verify (0 = all)"
        required: false
        default: "0"
      verify_tcp_concurrency:
        description: "Concurrent TCP checks (cheap, one CONNECT each)"
        required: false
        default: "750"
      verify_https_concurrency:
        description: "Concurrent HTTPS checks (each is a full TLS handshake)"
        required: false
        default: "100"
      debug_https:
        description: "Print HTTPS handshake failures"
        type: boolean
        default: false
      https_url:
        description: "HTTPS test URL"
        required: false
        default: "https://www.gstatic.com/generate_204"

permissions:
  contents: write

concurrency:
  group: proxy-database-update
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Install sing-box
        shell: bash
        run: |
          set -euo pipefail
          version="1.14.0"
          archive="sing-box-${version}-linux-amd64.tar.gz"
          curl --fail --location --silent --show-error --retry 3 \
            "https://github.com/SagerNet/sing-box/releases/download/v${version}/${archive}" \
            -o "/tmp/${archive}"
          echo "2375de6999f4f56ab46b4fc5ddf26a6aba1d3e61a0f4e7ddec2f4690457d5f63  /tmp/${archive}" | sha256sum --check --status
          tar -xzf "/tmp/${archive}" -C /tmp
          sudo install -m 0755 "/tmp/sing-box-${version}-linux-amd64/sing-box" /usr/local/bin/sing-box
          sing-box version

      - name: Verify sing-box works
        run: |
          echo '{"log":{"level":"error"},"inbounds":[],"outbounds":[{"type":"direct","tag":"direct"}]}' > /tmp/test-config.json
          sing-box check -c /tmp/test-config.json
          timeout 3 sing-box run -c /tmp/test-config.json 2>/dev/null || true
          echo "sing-box test passed"

      - name: Download DB-IP Lite country database
        shell: bash
        run: |
          set -euo pipefail

          current="$(date -u +%Y-%m)"
          previous="$(date -u -d '1 month ago' +%Y-%m)"

          download() {
            local month="$1"
            local url="https://download.db-ip.com/free/dbip-country-lite-${month}.mmdb.gz"
            echo "Trying ${url}"
            if curl --fail --location --silent --show-error --retry 3 --connect-timeout 20 \
              "${url}" -o GeoLite2-Country.mmdb.gz; then
              echo "Downloaded DB-IP Lite ${month}"
              return 0
            fi
            return 1
          }

          if ! download "${current}"; then
            echo "Current month database unavailable; trying previous month ${previous}."
            download "${previous}"
          fi

          gzip -dc GeoLite2-Country.mmdb.gz > GeoLite2-Country.mmdb
          test -s GeoLite2-Country.mmdb
          ls -lh GeoLite2-Country.mmdb

      - name: Run collector
        run: python main.py

      - name: Run verification (Tier 1/2/3)
        shell: bash
        env:
          WORKER_URL: https://proxy-egress-ip-check.keqa94tfn-cgr8m3z.workers.dev
          WORKER_TOKEN: ${{ secrets.IP_CHECK_WORKER_TOKEN }}
          VERIFY_TCP_CONCURRENCY: ${{ inputs.verify_tcp_concurrency || '750' }}
          VERIFY_HTTPS_CONCURRENCY: ${{ inputs.verify_https_concurrency || '100' }}
          VERIFY_LIMIT: ${{ inputs.verify_limit || '0' }}
          VERIFY_DEBUG_HTTPS: ${{ inputs.debug_https && '1' || '' }}
          VERIFY_HTTPS_URL: ${{ inputs.https_url || 'https://www.gstatic.com/generate_204' }}
        run: |
          # This job opens thousands of sockets; the default soft limit is ~1024.
          ulimit -n 65535 || echo "warning: could not raise fd limit"
          ulimit -n
          python tools/verify.py

      - name: Preserve latest egress health index
        shell: bash
        run: |
          set -euo pipefail
          url="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/gh-pages/egress-health.json?ts=$(date +%s)"
          if curl --fail --location --silent --show-error "$url" -o /tmp/egress-health.json; then
            cp /tmp/egress-health.json output/egress-health.json
          else
            echo "No published egress health index yet."
          fi

      - name: Show generated summary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          manifest = json.loads(Path("output/manifest.json").read_text())
          print(json.dumps(manifest, indent=2, ensure_ascii=False))
          PY

      - name: Show verification summary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          verify = json.loads(Path("verify-output/enriched-configs.json").read_text())
          print(json.dumps(verify.get("stats", {}), indent=2))
          PY

      - name: Deploy generated database to gh-pages
        uses: peaceiris/actions-gh-pages@v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./output
          force_orphan: true
          full_commit_message: "auto: update proxy database"
